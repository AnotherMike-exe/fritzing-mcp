[project]
name = "fritzing-mcp"
version = "0.1.0"
description = "MCP stdio server: build and edit Fritzing circuit designs (.fzz) and custom parts via the fz CLI"
license = "MIT"
dependencies = [
    "fastmcp>=2.9",
]

[project.scripts]
fritzing-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]
